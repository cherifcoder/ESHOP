<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs - Gestion Boutique</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-store"></i>
                <h2>Gestion Boutique</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Tableau de bord</span>
                </a>
                <div class="nav-section">Gestion</div>
                <a href="articles.html" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Articles</span>
                </a>
                <a href="clients.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Clients</span>
                </a>
                <a href="ventes.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Ventes</span>
                </a>
                <a href="depenses.html" class="nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Dépenses</span>
                </a>
                <div class="nav-section">Rapports</div>
                <a href="rapports.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Rapports & Graphiques</span>
                </a>
                <div class="nav-section">Administration</div>
                <a href="utilisateurs.html" class="nav-item active">
                    <i class="fas fa-user-cog"></i>
                    <span>Utilisateurs</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Gestion des Utilisateurs</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Déconnexion
                    </button>
                </div>
            </header>

            <div class="table-container">
                <div class="table-header">
                    <h2>Liste des Utilisateurs</h2>
                    <button class="btn-primary" onclick="openUserModal()">
                        <i class="fas fa-plus"></i> Ajouter un utilisateur
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nom d'utilisateur</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Rôle</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitleUser">Ajouter un Utilisateur</h2>
                <button class="close-btn" onclick="closeUserModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label for="userUsername">Nom d'utilisateur *</label>
                    <input type="text" id="userUsername" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="userNom">Nom *</label>
                        <input type="text" id="userNom" required>
                    </div>
                    <div class="form-group">
                        <label for="userPrenom">Prénom *</label>
                        <input type="text" id="userPrenom" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="userRole">Rôle *</label>
                    <select id="userRole" required style="width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px;">
                        <option value="">Sélectionner un rôle</option>
                        <option value="admin">Administrateur</option>
                        <option value="manager">Manager</option>
                        <option value="livreur">Livreur</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="userPassword">Mot de passe *</label>
                    <input type="password" id="userPassword" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeUserModal()">Annuler</button>
                <button class="btn-primary" onclick="saveUser()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utilisateurs.js"></script>
</body>
</html>
