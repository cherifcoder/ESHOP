<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Clients - Gestion Boutique</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-store"></i>
                <h2>Gestion Boutique</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Tableau de bord</span>
                </a>
                <div class="nav-section">Gestion</div>
                <a href="articles.html" class="nav-item">
                    <i class="fas fa-box"></i>
                    <span>Articles</span>
                </a>
                <a href="clients.html" class="nav-item active">
                    <i class="fas fa-users"></i>
                    <span>Clients</span>
                </a>
                <a href="ventes.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Ventes</span>
                </a>
                <a href="depenses.html" class="nav-item">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Dépenses</span>
                </a>
                <div class="nav-section">Rapports</div>
                <a href="rapports.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Rapports & Graphiques</span>
                </a>
                <div class="nav-section admin-only" id="adminSection" style="display: none;">
                    <div class="nav-section">Administration</div>
                    <a href="utilisateurs.html" class="nav-item">
                        <i class="fas fa-user-cog"></i>
                        <span>Utilisateurs</span>
                    </a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Gestion des Clients</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Déconnexion
                    </button>
                </div>
            </header>

            <div class="table-container">
                <div class="table-header">
                    <h2>Liste des Clients</h2>
                    <button class="btn-primary" onclick="openClientModal()">
                        <i class="fas fa-plus"></i> Ajouter un client
                    </button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Téléphone</th>
                            <th>Email</th>
                            <th>Adresse</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTable">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="clientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitleClient">Ajouter un Client</h2>
                <button class="close-btn" onclick="closeClientModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="clientId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientNom">Nom *</label>
                        <input type="text" id="clientNom" required>
                    </div>
                    <div class="form-group">
                        <label for="clientPrenom">Prénom *</label>
                        <input type="text" id="clientPrenom" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientTelephone">Téléphone *</label>
                        <input type="tel" id="clientTelephone" required>
                    </div>
                    <div class="form-group">
                        <label for="clientEmail">Email</label>
                        <input type="email" id="clientEmail">
                    </div>
                </div>
                <div class="form-group">
                    <label for="clientAdresse">Adresse</label>
                    <input type="text" id="clientAdresse">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeClientModal()">Annuler</button>
                <button class="btn-primary" onclick="saveClient()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/clients.js"></script>
</body>
</html>
